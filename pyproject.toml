[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portable-ea5-tester"
version = "1.0.0"
description = "Headless, portable MT5 EA (.mq5/.ex5) compilation and strategy testing framework."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "hjQuantLab" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
pea5 = "portable_ea5_tester.cli:main"
portable-ea5-tester = "portable_ea5_tester.cli:main"
pst-runner = "portable_ea5_tester.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]